<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Gợn nước lan tỏa</title><style>.m{transform-origin:100px 100px;animation:rip 4s ease-out infinite}.d{animation-delay:2s}@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.1);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><circle class="m" cx="100" cy="100" r="80" fill="none" stroke="#243F32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="m d" cx="100" cy="100" r="80" fill="none" stroke="#243F32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="100" r="6" fill="#243F32"/></svg>
