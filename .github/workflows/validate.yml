name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm run audit
      - run: npm run test:contact
      - run: node --test tests/hybrid-nature.test.mjs
      - run: npm run test:search
      - run: npm run test:shop
      - run: npm run test:worker
      - run: npm run build
      - run: npm run audit:build
      - run: node --test tests/ecosystem-content.test.mjs tests/ecosystem-orbit.test.mjs tests/home-discovery.test.mjs
      - run: npm run build:pages-functions
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx wrangler deploy --dry-run --config wrangler.worker.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify mobile navigation and keyboard controls
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/vi/ >/dev/null; then break; fi
            sleep 1
          done
          APP_BASE_URL=http://127.0.0.1:4321 python tests/navigation-controls-browser.py
