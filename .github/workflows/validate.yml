name: Validate website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm run audit
      - run: npm run test:contact
      - run: node --test tests/hybrid-nature.test.mjs
      - run: npm run test:search
      - run: npm run test:shop
      - run: npm run test:worker
      - run: npm run build
      - run: npm run audit:build
      - run: node --test tests/ecosystem-content.test.mjs tests/ecosystem-orbit.test.mjs
      - run: npm run build:pages-functions
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npx wrangler deploy --dry-run --config wrangler.worker.jsonc
        env:
          WRANGLER_SEND_METRICS: 'false'
