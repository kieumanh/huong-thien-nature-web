<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"><title>A monthly practice wheel: sow an intention, tend it, reflect, release</title><defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#100c24"/><stop offset=".6" stop-color="#2c1f50"/><stop offset="1" stop-color="#4a2f5e"/></linearGradient><radialGradient id="mid"><stop offset="0" stop-color="#f4c76b" stop-opacity=".3"/><stop offset="1" stop-color="#f4c76b" stop-opacity="0"/></radialGradient><clipPath id="disc"><circle cx="600" cy="400" r="72"/></clipPath><style>text{font-family:'Be Vietnam Pro','Noto Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:600}.dotspin{transform-origin:600px 400px;animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.node{fill-opacity:.7;animation:nodeglow 24s ease-in-out infinite}.n2{animation-delay:6s}.n3{animation-delay:12s}.n4{animation-delay:18s}@keyframes nodeglow{0%{fill-opacity:1;transform:scale(1.14)}16%{fill-opacity:.7;transform:scale(1)}100%{fill-opacity:.7;transform:scale(1)}}.node{transform-box:fill-box;transform-origin:center}.core{animation:coremoon 24s linear infinite}@keyframes coremoon{0%{transform:translateX(0)}49.99%{transform:translateX(-140px)}50%{transform:translateX(140px)}100%{transform:translateX(0)}}.breath{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.9}}.tw{animation:tw 5s ease-in-out infinite}.tw1{animation-delay:-1.7s}.tw2{animation-delay:-3.3s}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style></defs><rect width="1200" height="800" fill="url(#night)"/><circle cx="25" cy="480" r="1.4" fill="#ffe7a8" opacity="0.6" class="tw tw0"/><circle cx="88" cy="142" r="2.7" fill="#ffe7a8" opacity="0.67" class="tw tw1"/><circle cx="285" cy="1