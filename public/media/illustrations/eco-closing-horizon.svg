<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img"><title>Một buổi chiều yên ắng bên hồ: cây xanh bên bờ, mặt nước lặng với những vòng sóng nhẹ, và mặt trời dịu ở phía chân trời</title><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2e4"/><stop offset=".62" stop-color="#f7ead0"/><stop offset="1" stop-color="#f4dcb0"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbdac0"/><stop offset="1" stop-color="#e9e0c6"/></linearGradient><radialGradient id="sunglow"><stop offset="0" stop-color="#fff3d2" stop-opacity=".95"/><stop offset=".45" stop-color="#f8d68a" stop-opacity=".45"/><stop offset="1" stop-color="#f8d68a" stop-opacity="0"/></radialGradient></defs><style>.glow{transform-box:fill-box;transform-origin:center;animation:breathe 10s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 9s ease-out infinite}.r2{animation-delay:-3s}.r3{animation-delay:-6s}.shine{animation:shine 7s ease-in-out infinite}.shine.s2{animation-delay:-3.5s}@keyframes breathe{0%,100%{transform:scale(.94);opacity:.72}50%{transform:scale(1.05);opacity:1}}@keyframes ripple{0%{transform:scale(.3);opacity:0}15%{opacity:.85}100%{transform:scale(1);opacity:0}}@keyframes shine{0%,100%{opacity:.3}50%{opacity:.75}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:.4}}</style><rect width="1200" height="600" fill="url(#sky)"/><circle class="glow" cx="860" cy="250" r="230" fill="url(#sunglow)"/><circle cx="860" cy="250" r="66" fill="#f8d68a"/><path d="M0,318 C140,284 290,286 430,314 S720,344 860,316 S1080,282 1200,306 L1200,410 L0,410 Z" fill="#cfdbc0"/><path d="M0,372 C150,350 300,352 440,374 S700,392 860,372 S1080,352 1200,364 L1200,412 L0,412 Z" fill="#a9c093"/><rect y="408" width="1200" height="192" fill="url(#water)"/><rect y="404" width="1200" height="8" fill="#8fa77a" opacity=".7"/><path d="M262,404 L262,330" stroke="#6f5a46" stroke-width="9" stroke-linecap="round"/><ellipse cx="262" cy="300" rx="62" ry="72" fill="#5f8055"/><ellipse cx="236" cy="290" rx="34" ry="40" fill="#739a68" opacity=".7"/><ellipse cx="290" cy="318" rx="30" ry="34" fill="#4e6e47" opacity=".8"/><path d="M262,412 L262,450" stroke="#6f5a46" stroke-width="7" stroke-linecap="round" opacity=".18"/><ellipse cx="262" cy="446" rx="60" ry="22" fill="#5f8055" opacity=".16"/><path class="shine" d="M846,440 H874 M832,468 H888 M820,500 H900" stroke="#f8d68a" stroke-width="5" stroke-linecap="round" fill="none"/><path class="shine s2" d="M852,530 H868 M840,558 H880" stroke="#f8d68a" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse class="ring" cx="520" cy="500" rx="48" ry="10" fill="none" stroke="#7f9d6f" stroke-width="2"/><ellipse class="ring r2" cx="520" cy="500" rx="48" ry="10" fill="none" stroke="#7f9d6f" stroke-width="2"/><ellipse class="ring r3" cx="520" cy="500" rx="48" ry="10" fill="none" stroke="#7f9d6f" stroke-width="2"/></svg>
