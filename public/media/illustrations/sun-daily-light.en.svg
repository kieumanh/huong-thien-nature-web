<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"><title>The Sun crossing the sky, and the body’s rhythm of alertness and sleepiness through a day</title><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf5e2"/><stop offset=".55" stop-color="#f8e6c4"/><stop offset="1" stop-color="#efd2a8"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".95"/><stop offset=".45" stop-color="#f4c76b" stop-opacity=".35"/><stop offset="1" stop-color="#f4c76b" stop-opacity="0"/></radialGradient><linearGradient id="sunbody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset="1" stop-color="#dc9b36"/></linearGradient><style>text{font-family:'Be Vietnam Pro','Noto Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:600}.sun{transform:translate(600px,140px);animation:sunpath 16s linear infinite}@keyframes sunpath{0.0%{transform:translate(120.0px,400.0px)}4.17%{transform:translate(160.0px,358.5px)}8.33%{transform:translate(200.0px,320.6px)}12.5%{transform:translate(240.0px,286.2px)}16.67%{transform:translate(280.0px,255.6px)}20.83%{transform:translate(320.0px,228.5px)}25.0%{transform:translate(360.0px,205.0px)}29.17%{transform:translate(400.0px,185.1px)}33.33%{transform:translate(440.0px,168.9px)}37.5%{transform:translate(480.0px,156.2px)}41.67%{transform:translate(520.0px,147.2px)}45.83%{transform:translate(560.0px,141.8px)}50.0%{transform:translate(600.0px,140.0px)}54.17%{transform:translate(640.0px,141.8px)}58.33%{transform:translate(680.0px,147.2px)}62.5%{transform:translate(720.0px,156.2px)}66.67%{transform:translate(760.0px,168.9px)}70.83%{transform:translate(800.0px,185.1px)}75.0%{transform:translate(840.0px,205.0px)}79.17%{transform:translate(880.0px,228.5px)}83.33%{transform:translate(920.0px,255.6px)}87.5%{transform:translate(960.0px,286.2px)}91.67%{transform:translate(1000.0px,320.6px)}95.83%{transform:translate(1040.0px,358.5px)}100.0%{transform:translate(1080.0px,400.0px)}}.guide{transform:translateX(600px);animation:guide 16s linear infinite}@keyframes guide{0%{transform:translateX(120px)}100%{transform:translateX(1080px)}}.halo{transform-box:fill-box;transform-origin:center;animation:halo 4s ease-in-out infinite}@keyframes halo{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style></defs><rect width="1200" height="800" fill="url(#sky)"/><path d="M120 400 Q600 -120 1080 400" fill="none" stroke="#c9873a" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/><line x1="60" y1="400" x2="1140" y2="400" stroke="#9c6b3a" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><g class="sun"><circle class="halo" r="120" fill="url(#glow)"/><circle r="46" fill="url(#sunbody)"/></g><text x="150" y="450" font-size="42" text-anchor="middle" fill="#3a2a55">Morning</text><text x="600" y="450" font-size="42" text-anchor="middle" fill="#3a2a55">Noon</text><text x="1050" y="450" font-size="42" text-anchor="middle" fill="#3a2a55">Evening</text><rect x="60" y="476" width="1080" height="256" rx="28" fill="#ffffff" fill-opacity=".42"/><line x1="100" y1="712" x2="1100" y2="712" stroke="#9c6b3a" stroke-opacity=".45" stroke-width="2"/><path d="M120 712 C330 712 420 510 600 510 S870 712 1080 712" fill="none" stroke="#dc9b36" stroke-width="9" stroke-linecap="round"/><path d="M120 522 C250 537 330 697 480 697 L720 697 C870 697 950 537 1080 522" fill="none" stroke="#6d4f9a" stroke-width="9" stroke-linecap="round"/><g class="guide"><line y1="492" y2="716" stroke="#7a4a6e" stroke-opacity=".6" stroke-width="3" stroke-dasharray="6 9"/></g><circle cx="372" cy="766" r="11" fill="#dc9b36"/><text x="394" y="779" font-size="38" fill="#3a2a55">Alert</text><circle cx="702" cy="766" r="11" fill="#6d4f9a"/><text x="724" y="779" font-size="38" fill="#3a2a55">Sleepy<