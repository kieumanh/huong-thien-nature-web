<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><title>Vòng tròn hơi thở (4s hít, 6s thở)</title><style>.m{transform-origin:100px 100px;animation:breath 10s cubic-bezier(.45,0,.55,1) infinite}@keyframes breath{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><circle class="m" cx="100" cy="100" r="70" fill="#243F32" opacity=".25"/><circle cx="100" cy="100" r="70" fill="none" stroke="#243F32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
