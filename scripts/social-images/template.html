<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!-- Source of the link-share images (1200 x 630). Rendered by render.py; see HANDOFF.md ("Ảnh chia sẻ").
     Open as template.html?v=brand|support&lang=vi|en. Composition is centred so the square crop some apps use (Zalo, chat previews) keeps all text. -->
<style>
@font-face { font-family: "Dancing Script"; src: url("../../public/fonts/dancing-script.vi.woff2") format("woff2"); font-weight: 600;
  unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
@font-face { font-family: "Dancing Script"; src: url("../../public/fonts/dancing-script.latin-ext.woff2") format("woff2"); font-weight: 600;
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Dancing Script"; src: url("../../public/fonts/dancing-script.latin.woff2") format("woff2"); font-weight: 600;
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; font-family: Inter, "Noto Sans", Arial, sans-serif; color: #f6ecd3;
  background:
    radial-gradient(ellipse 620px 420px at 50% 62%, #5b3d86aa 0%, #5b3d8600 70%),
    radial-gradient(ellipse 900px 520px at 50% 108%, #e8ab4a55 0%, #e8ab4a00 70%),
    linear-gradient(165deg, #120c28 0%, #271a4a 52%, #3f2858 100%); }
.rings { position: absolute; inset: 0; }
.stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.eyebrow { position: absolute; top: 34px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px;
  font-weight: 600; font-size: 20px; letter-spacing: .34em; text-indent: .34em; color: #ffe7a8; }
.eyebrow::before, .eyebrow::after { content: ""; width: 64px; height: 1px; background: linear-gradient(90deg, #f4c76b00, #f4c76bcc); }
.eyebrow::after { transform: scaleX(-1); }
.gold { background: linear-gradient(100deg, #fff1c4 0%, #f4c76b 38%, #dc9b36 64%, #ffe7a8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.script { padding-block: .1em .26em; font-family: "Dancing Script", cursive; font-weight: 600; line-height: 1.12; text-align: center; }
.url { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 19px; letter-spacing: .12em; color: #e9d9b0cc; }
/* support */
.seed { position: absolute; top: 50px; left: 50%; width: 404px; height: 359px; margin-left: -202px; overflow: visible; }
.support-title { position: absolute; top: 376px; left: 0; right: 0; font-size: 104px; }
.support-sub { position: absolute; top: 508px; left: 0; right: 0; text-align: center; font-size: 31px; font-weight: 400; letter-spacing: .01em; color: #f6ecd3; }
/* brand */
.logo { position: absolute; top: 78px; left: 50%; width: 330px; margin-left: -165px; filter: drop-shadow(0 8px 30px #00000066); }
.brand-line { position: absolute; left: 0; right: 0; font-size: 60px; }
.brand-line--1 { top: 408px; }
.brand-line--2 { top: 478px; }
/* tarot course (share picture with text, and the text-free illustration used on cards and in search) */
.fan { position: absolute; inset: 0; width: 1200px; height: 630px; overflow: visible; }
.tarot-title { position: absolute; top: 64px; left: 0; right: 0; font-size: 96px; }
.tarot-sub { position: absolute; top: 322px; left: 0; right: 0; text-align: center; font-size: 28px; font-weight: 400; letter-spacing: .01em; color: #f6ecd3; }
</style>
</head>
<body>
<svg class="rings" viewBox="0 0 1200 630" aria-hidden="true">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#m)" fill="none" stroke="#f4c76b" stroke-width="1.3">
    <g opacity=".20"><circle cx="600" cy="315" r="170"/><circle cx="600" cy="315" r="250"/><circle cx="600" cy="315" r="335"/><circle cx="600" cy="315" r="430"/><circle cx="600" cy="315" r="540"/></g>
    <g opacity=".16"><ellipse cx="600" cy="315" rx="470" ry="150" transform="rotate(-18 600 315)"/><ellipse cx="600" cy="315" rx="470" ry="150" transform="rotate(18 600 315)"/></g>
  </g>
  <g fill="#ffe7a8">
    <circle cx="150" cy="120" r="2.4" opacity=".8"/><circle cx="238" cy="470" r="1.8" opacity=".6"/><circle cx="96" cy="330" r="1.6" opacity=".5"/><circle cx="330" cy="62" r="1.8" opacity=".55"/>
    <circle cx="1040" cy="96" r="2.4" opacity=".8"/><circle cx="1110" cy="400" r="2" opacity=".6"/><circle cx="930" cy="540" r="1.8" opacity=".6"/><circle cx="880" cy="60" r="1.6" opacity=".5"/>
    <circle cx="190" cy="570" r="1.6" opacity=".5"/><circle cx="1010" cy="300" r="1.5" opacity=".45"/>
  </g>
</svg>
<div class="stage" id="stage"></div>
<script>
const params = new URLSearchParams(location.search);
const variant = params.get('v') || 'brand';
const lang = params.get('lang') === 'en' ? 'en' : 'vi';
document.documentElement.lang = lang;
const copy = {
  brand: {
    vi: ['Thiền định, chánh niệm', 'và sống thuận tự nhiên'],
    en: ['Meditation, mindfulness', 'and living close to nature'],
  },
  support: {
    vi: { title: 'Quỹ ủng hộ', sub: 'Cùng nhau gieo mầm và lan tỏa' },
    en: { title: 'Support fund', sub: 'Sowing seeds and spreading them together' },
  },
  tarot: {
    vi: { lines: ['Lắng nghe mình', 'qua tarot'], sub: 'Buổi 1:1 trong 90 phút cùng Hương Thiền' },
    en: { lines: ['Listening to yourself', 'through tarot'], sub: 'A 90-minute one-to-one session with Hương Thiền' },
  },
};
// A fan of five original cards, pivot below the frame. Motifs are our own (moon, lotus, rays, path, a star and a ring of light for the centre card: "myself").
function tarotFan(px, py, len, w) {
  const r = w * 0.26;
  const cy = -len * 0.52;
  const motif = {
    moon: `<circle cx="0" cy="${cy}" r="${r}" fill="#dc9b36"/><circle cx="${(r * 0.42).toFixed(1)}" cy="${(cy - r * 0.12).toFixed(1)}" r="${(r * 0.92).toFixed(1)}" fill="#fff3d0"/>`,
    rings: `<circle cx="0" cy="${cy}" r="${r}" fill="none" stroke="#dc9b36" stroke-width="2.2"/><circle cx="0" cy="${cy}" r="${(r * 0.62).toFixed(1)}" fill="none" stroke="#6d4f9a" stroke-width="1.6"/><circle cx="0" cy="${cy}" r="${(r * 0.22).toFixed(1)}" fill="#dc9b36"/>`,
    lotus: [-60, -30, 0, 30, 60].map(a => `<ellipse cx="0" cy="${(cy - r * 0.2).toFixed(1)}" rx="${(r * 0.26).toFixed(1)}" ry="${(r * 0.95).toFixed(1)}" transform="rotate(${a} 0 ${(cy + r * 0.55).toFixed(1)})" fill="none" stroke="#6d4f9a" stroke-width="1.7"/>`).join(''),
    path: `<path d="M${(-r).toFixed(1)} ${(cy + r * 0.5).toFixed(1)} Q0 ${(cy - r * 1.4).toFixed(1)} ${r.toFixed(1)} ${(cy + r * 0.5).toFixed(1)}" fill="none" stroke="#6d4f9a" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="${r.toFixed(1)}" cy="${(cy + r * 0.5).toFixed(1)}" r="4" fill="#dc9b36"/>`,
    star: `<path d="M0 ${(cy - r).toFixed(1)} Q${(r * 0.12).toFixed(1)} ${(cy - r * 0.12).toFixed(1)} ${r.toFixed(1)} ${cy.toFixed(1)} Q${(r * 0.12).toFixed(1)} ${(cy + r * 0.12).toFixed(1)} 0 ${(cy + r).toFixed(1)} Q${(-r * 0.12).toFixed(1)} ${(cy + r * 0.12).toFixed(1)} ${(-r).toFixed(1)} ${cy.toFixed(1)} Q${(-r * 0.12).toFixed(1)} ${(cy - r * 0.12).toFixed(1)} 0 ${(cy - r).toFixed(1)}Z" fill="#dc9b36"/>`,
    self: `<circle cx="0" cy="${cy}" r="${(r * 1.7).toFixed(1)}" fill="none" stroke="#dc9b36" stroke-opacity=".45" stroke-width="1.2"/><circle cx="0" cy="${cy}" r="${(r * 1.1).toFixed(1)}" fill="none" stroke="#dc9b36" stroke-width="2"/><circle cx="0" cy="${cy}" r="${(r * 0.42).toFixed(1)}" fill="#dc9b36"/><circle cx="0" cy="${cy}" r="${(r * 0.18).toFixed(1)}" fill="#fff8e2"/>`,
  };
  // Left to right: five angles; the centre card (0°) carries the "self" motif and is drawn last so it sits on top.
  const angles = [-50, -25, 0, 25, 50];
  const motifs = [motif.star, motif.moon, motif.self, motif.rings, motif.path];
  const drawOrder = [0, 1, 3, 4, 2];
  const cards = drawOrder.map(i => `<g transform="translate(${px} ${py}) rotate(${angles[i]})">
    <rect x="${-w / 2}" y="${-len}" width="${w}" height="${len}" rx="14" fill="url(#face)" stroke="#f4c76b" stroke-width="2"/>
    <rect x="${(-w / 2 + 9).toFixed(1)}" y="${(-len + 9).toFixed(1)}" width="${w - 18}" height="${len - 18}" rx="9" fill="none" stroke="#b07a2a" stroke-opacity=".5" stroke-width="1.2"/>
    ${motifs[i]}</g>`).join('');
  return `<svg class="fan" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#ecd29b"/></linearGradient>
      <radialGradient id="halo"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".6"/><stop offset="1" stop-color="#f4c76b" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="${px}" cy="${(py + cy).toFixed(1)}" r="${(w * 2.4).toFixed(1)}" fill="url(#halo)"/>
    ${cards}
  </svg>`;
}
const stage = document.getElementById('stage');
if (variant === 'brand') {
  const [a, b] = copy.brand[lang];
  stage.innerHTML = `
    <img class="logo" src="logo-white.png" alt="" />
    <p class="script gold brand-line brand-line--1">${a}</p>
    <p class="script gold brand-line brand-line--2">${b}</p>
    <p class="url">huongthiennature.com</p>`;
} else if (variant === 'tarot' || variant === 'tarot-art') {
  if (variant === 'tarot-art') {
    stage.innerHTML = tarotFan(600, 690, 340, 160);
  } else {
    const t = copy.tarot[lang];
    stage.innerHTML = `
      <p class="eyebrow">HƯƠNG THIỀN NATURE</p>
      <p class="script gold tarot-title">${t.lines[0]}<br>${t.lines[1]}</p>
      <p class="tarot-sub">${t.sub}</p>
      ${tarotFan(600, 700, 280, 132)}`;
  }
} else {
  const c = copy.support[lang];
  stage.innerHTML = `
    <p class="eyebrow">HƯƠNG THIỀN NATURE</p>
    <svg class="seed" viewBox="0 0 360 320" aria-hidden="true">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2c45a" stop-opacity=".62"/><stop offset="1" stop-color="#f2c45a" stop-opacity="0"/></radialGradient>
        <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98059"/><stop offset="1" stop-color="#6f5239"/></linearGradient>
      </defs>
      <circle cx="180" cy="196" r="160" fill="url(#glow)"/>
      <g fill="none" stroke="#f4c76b" stroke-width="1.8">
        <ellipse cx="180" cy="248" rx="46" ry="12.5" opacity=".95"/><ellipse cx="180" cy="248" rx="82" ry="22" opacity=".6"/><ellipse cx="180" cy="248" rx="124" ry="33" opacity=".32"/>
      </g>
      <path d="M70 262c28-24 70-34 110-34s82 10 110 34c-30 20-70 30-110 30s-80-10-110-30z" fill="url(#soil)"/>
      <path d="M120 258c16-8 40-12 60-12s44 4 60 12" fill="none" stroke="#c9a577" stroke-width="2" stroke-linecap="round" opacity=".75"/>
      <path d="M180 244c-2-34 4-62-2-92" fill="none" stroke="#5b9556" stroke-width="5" stroke-linecap="round"/>
      <path d="M178 190c-32-4-52-24-56-52 30-2 54 14 56 52z" fill="#6aa05f"/><path d="M178 190c-18-14-32-30-42-46" fill="none" stroke="#4d7f49" stroke-width="2" stroke-linecap="round"/>
      <path d="M178 168c30-6 50-26 52-56-30 0-52 18-52 56z" fill="#8cc180"/><path d="M178 168c16-14 30-28 40-44" fill="none" stroke="#4d7f49" stroke-width="2" stroke-linecap="round"/>
      <circle cx="176" cy="148" r="10" fill="#f0c05a"/>
      <path d="M176 138c-8-10-4-20 0-26 4 6 8 16 0 26zM176 138c10-6 22-4 28 0-6 6-18 8-28 0zM176 138c-10-6-22-4-28 0 6 6 18 8 28 0z" fill="#f7d98a" opacity=".95"/>
      <g fill="#f4c76b"><circle cx="120" cy="230" r="3"/><circle cx="240" cy="220" r="2.6"/><circle cx="150" cy="200" r="2.2"/><circle cx="214" cy="190" r="3"/><circle cx="100" cy="190" r="2"/><circle cx="262" cy="176" r="2.2"/><circle cx="196" cy="120" r="2"/><circle cx="150" cy="118" r="1.8"/></g>
    </svg>
    <p class="script gold support-title">${c.title}</p>
    <p class="support-sub">${c.sub}</p>
    <p class="url">huongthiennature.com</p>`;
}
</script>
</body>
</html>
